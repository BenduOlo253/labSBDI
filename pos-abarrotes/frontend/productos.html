<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Productos</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/styles.css"></head><body><main class="mobile-shell p-3"><a href="menu.html" class="btn btn-link">← Menú</a><h1 class="h4">Productos</h1><div id="msg"></div><div class="card card-pos p-3 mb-3"><form id="productoForm"><input name="codigoBarras" class="form-control mb-2" placeholder="Código de barras"><input name="nombre" class="form-control mb-2" placeholder="Nombre" required><textarea name="descripcion" class="form-control mb-2" placeholder="Descripción"></textarea><div class="row g-2"><div class="col"><select name="idCategoria" class="form-select"><option value="1">Bebidas</option><option value="2">Lácteos</option><option value="3">Botanas</option><option value="4">Limpieza</option><option value="5">Abarrotes</option></select></div><div class="col"><select name="idUnidad" class="form-select"><option value="1">Pieza</option><option value="2">Kg</option><option value="3">Litro</option></select></div></div><select name="idImpuesto" class="form-select my-2"><option value="1">IVA 16%</option><option value="2">IVA 0%</option></select><div class="row g-2"><div class="col"><input name="precioCompra" type="number" step="0.01" class="form-control" placeholder="Compra" required></div><div class="col"><input name="precioVenta" type="number" step="0.01" class="form-control" placeholder="Venta" required></div></div><div class="row g-2 mt-2"><div class="col"><input name="stockMinimo" type="number" step="0.001" class="form-control" placeholder="Stock mín" value="0"></div><div class="col"><input name="stockMaximo" type="number" step="0.001" class="form-control" placeholder="Stock máx" value="0"></div></div><button class="btn btn-success w-100 mt-3">Guardar producto</button></form></div><input id="buscar" class="form-control mb-2" placeholder="Buscar por nombre o código"><div id="listaProductos" class="card card-pos p-3"></div></main><script type="module" src="js/controllers/productoController.js"></script></body></html>
