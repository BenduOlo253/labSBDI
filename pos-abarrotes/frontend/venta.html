<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Venta</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/styles.css"></head><body><main class="mobile-shell p-3 pb-5"><a href="menu.html" class="btn btn-link">← Menú</a><h1 class="h4">Nueva venta</h1><div id="msg"></div><input id="buscar" class="form-control mb-2" placeholder="Buscar producto por nombre o código"><div id="resultados" class="card card-pos p-3 mb-3"></div><h2 class="h6">Carrito</h2><div id="carrito" class="card card-pos p-3 mb-3"></div><form id="ventaForm" class="card card-pos p-3 sticky-total"><div class="d-flex justify-content-between align-items-center mb-2"><strong>Total</strong><strong id="total" class="fs-4">$0.00</strong></div><select id="metodo" class="form-select mb-2"><option value="1">Efectivo</option><option value="2">Tarjeta</option><option value="3">Transferencia</option></select><input id="referencia" class="form-control mb-2" placeholder="Referencia opcional"><input id="monto" type="number" step="0.01" class="form-control mb-2" placeholder="Monto recibido" required><div class="mb-2">Cambio: <strong id="cambio">$0.00</strong></div><button class="btn btn-success btn-lg w-100">Finalizar venta</button></form></main><script type="module" src="js/controllers/ventaController.js"></script></body></html>
